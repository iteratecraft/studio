# SQL LRS for the xAPI end-to-end job (M2-21, STD-06; standards.md X-7): Yet Analytics' SQL LRS
# (Apache-2.0) on its built-in SQLite store, twice: one that speaks xAPI 2.0 and 1.0.3, as it does by
# default, and one held to 1.0.3. Start them with `pnpm --filter @course-suite/conformance lrs:up`;
# see docs/ci.md. The image is pinned by digest; bump it only to one published at least two weeks
# earlier.
name: course-suite-lrs

x-lrs: &lrs
  image: yetanalytics/lrsql:v0.9.9@sha256:d0054b96ebbb41b10b371e815e326918b70f0d1788e8d24afc60af465b8f41cd
  environment: &lrs-environment
    # The credentials a launch link carries (test only), and the admin account that seeds them.
    LRSQL_API_KEY_DEFAULT: coursesuite
    LRSQL_API_SECRET_DEFAULT: coursesuite-secret
    LRSQL_ADMIN_USER_DEFAULT: admin
    LRSQL_ADMIN_PASS_DEFAULT: Admin-pass-1
    # The course runs on another origin (the test LMS that serves the package).
    LRSQL_ALLOW_ALL_ORIGINS: "true"
  # The xAPI About resource answers without credentials once the LRS is up (BusyBox wget).
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/xapi/about"]
    interval: 2s
    timeout: 5s
    retries: 60

services:
  lrs:
    <<: *lrs
    ports:
      - 127.0.0.1:${LRS_PORT:-8270}:8080

  lrs103:
    <<: *lrs
    environment:
      <<: *lrs-environment
      LRSQL_SUPPORTED_VERSIONS: "1.0.3"
    ports:
      - 127.0.0.1:${LRS103_PORT:-8271}:8080
