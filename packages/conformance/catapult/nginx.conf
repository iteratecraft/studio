# One origin for CATAPULT's CTS and its cmi5 player, as CATAPULT's own deployment puts them
# (cts/nginx/default.conf), without TLS: the CTS at /, the player and the course content at /player.
events {}

http {
    client_max_body_size 300M;

    server {
        listen 80;

        location / {
            proxy_set_header Host $http_host;
            proxy_pass http://webservice:3399;
        }

        location /player {
            proxy_set_header Host $http_host;
            proxy_pass http://player:3398/player;
        }
    }
}
