name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

# A newer push to a pull request cancels its run still in progress. Each push to main
# gets its own group (head_ref is empty), so main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows first (ADR-0001). The lead adds the next OS when it is ready to support:
        # os: [windows-latest, macos-latest]
        # os: [windows-latest, macos-latest, ubuntu-latest]
        # On Linux the Playwright step also needs `--with-deps`.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:deps
      - run: pnpm check:clean-room
      # The specs repository is not checked out in CI, so this skips with exit 0 at the default
      # `../specs`; it fails only if the script itself breaks.
      - run: pnpm report:trace

      - name: Install Chromium for Playwright
        run: pnpm --filter @course-suite/web exec playwright install --only-shell chromium
      - name: Browser smoke test
        run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
