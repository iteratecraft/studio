name: Hosts

# Our packages in real hosts beyond Moodle (M2-21, D-26; standards.md T-2, T-5, X-7): SCORM 1.2 and
# 2004 in ILIAS, xAPI in SQL LRS and cmi5 in ADL CATAPULT's Content Test Suite. Linux jobs, like the
# Moodle job in ci.yml and under the same exception to ADR-0001's Windows-first rule: they only host
# third-party servers, whose containers need Linux. They run beside CI, only on pull requests that
# change what goes into a package or these harnesses, every night on main, and by hand; see
# docs/ci.md.
on:
  pull_request:
    paths:
      - "packages/format/**"
      - "packages/labels/**"
      - "packages/tracking/**"
      - "packages/player-blocks/**"
      - "packages/exporters/**"
      - "packages/zip/**"
      - "packages/fonts/**"
      - "packages/conformance/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/hosts.yml"
  schedule:
    # Nightly, on main (scheduled runs use the default branch).
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # SCORM 1.2 and SCORM 2004 4th edition in ILIAS (M2-21, STD-19; standards.md T-5).
  ilias:
    name: ilias (SCORM 1.2 and 2004 end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@course-suite/conformance...

      # The ILIAS release and the images (the built web server and MariaDB), keyed on the files
      # that pin them.
      - name: Restore the ILIAS cache
        id: ilias-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/ilias/.cache
          key: ilias-${{ hashFiles('packages/conformance/ilias/up.ts', 'packages/conformance/ilias/compose.yaml', 'packages/conformance/ilias/Dockerfile') }}
      - name: Load the cached ILIAS images
        if: steps.ilias-cache.outputs.cache-hit == 'true'
        run: docker load --input packages/conformance/ilias/.cache/images.tar
      - name: Start ILIAS
        run: pnpm --filter @course-suite/conformance ilias:up
      - name: Keep the ILIAS images for the cache
        if: steps.ilias-cache.outputs.cache-hit != 'true'
        run: docker save --output packages/conformance/ilias/.cache/images.tar $(docker compose -f packages/conformance/ilias/compose.yaml config --images | sort -u)

      - name: Install Chromium for Playwright
        run: pnpm --filter @course-suite/conformance exec playwright install --with-deps --only-shell chromium
      - name: SCORM 1.2 and 2004 in ILIAS
        run: pnpm --filter @course-suite/conformance test:ilias

      # cancelled() too: a job that hits timeout-minutes is cancelled, and failure() is then false.
      - name: Collect the ILIAS logs
        if: failure() || cancelled()
        run: |
          docker compose -f packages/conformance/ilias/compose.yaml logs --no-color --timestamps > ilias-logs.txt 2>&1 || true
          docker compose -f packages/conformance/ilias/compose.yaml exec -T webserver sh -c 'tail -n 2000 /var/www/logs/*' >> ilias-logs.txt 2>&1 || true
      - name: Upload Playwright traces and ILIAS logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ilias-e2e
          path: |
            ilias-logs.txt
            packages/conformance/ilias/playwright-report/
            packages/conformance/ilias/test-results/
          if-no-files-found: ignore

  # xAPI statements and resume in SQL LRS, speaking 2.0 and 1.0.3 (M2-21, STD-06; standards.md X-7).
  lrs:
    name: lrs (xAPI in SQL LRS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@course-suite/conformance...
      - name: Start SQL LRS
        run: pnpm --filter @course-suite/conformance lrs:up
      - name: Install Chromium for Playwright
        run: pnpm --filter @course-suite/conformance exec playwright install --with-deps --only-shell chromium
      - name: xAPI in SQL LRS
        run: pnpm --filter @course-suite/conformance test:lrs
      - name: Collect the LRS logs
        if: failure() || cancelled()
        run: docker compose -f packages/conformance/lrs/compose.yaml logs --no-color --timestamps > lrs-logs.txt 2>&1 || true
      - name: Upload Playwright traces and LRS logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lrs-e2e
          path: |
            lrs-logs.txt
            packages/conformance/lrs/playwright-report/
            packages/conformance/lrs/test-results/
          if-no-files-found: ignore

  # cmi5 in ADL CATAPULT's Content Test Suite (M2-21, STD-03, STD-07; standards.md T-2). Its report
  # is kept as an artifact on every run.
  catapult:
    name: catapult (cmi5 content tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@course-suite/conformance...

      # The CATAPULT checkout and the images (built from it, and the pinned ones), keyed on the files
      # that pin them.
      - name: Restore the CATAPULT cache
        id: catapult-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/catapult/.cache
          key: catapult-${{ hashFiles('packages/conformance/catapult/up.ts', 'packages/conformance/catapult/compose.yaml') }}
      - name: Load the cached CATAPULT images
        if: steps.catapult-cache.outputs.cache-hit == 'true'
        run: docker load --input packages/conformance/catapult/.cache/images.tar
      - name: Start CATAPULT
        run: pnpm --filter @course-suite/conformance catapult:up
      - name: Keep the CATAPULT images for the cache
        if: steps.catapult-cache.outputs.cache-hit != 'true'
        run: |
          export CATAPULT_COMMIT=$(git -C packages/conformance/catapult/.cache/CATAPULT rev-parse HEAD)
          docker save --output packages/conformance/catapult/.cache/images.tar $(docker compose -f packages/conformance/catapult/compose.yaml config --images | sort -u)

      - name: Install Chromium for Playwright
        run: pnpm --filter @course-suite/conformance exec playwright install --with-deps --only-shell chromium
      - name: cmi5 in CATAPULT's Content Test Suite
        run: pnpm --filter @course-suite/conformance test:catapult

      - name: Upload the CTS reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catapult-cts-reports
          path: packages/conformance/catapult/reports/
          if-no-files-found: ignore
      - name: Collect the CATAPULT logs
        if: failure() || cancelled()
        run: docker compose -f packages/conformance/catapult/compose.yaml logs --no-color --timestamps > catapult-logs.txt 2>&1 || true
      - name: Upload Playwright traces and CATAPULT logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catapult-e2e
          path: |
            catapult-logs.txt
            packages/conformance/catapult/playwright-report/
            packages/conformance/catapult/test-results/
          if-no-files-found: ignore
