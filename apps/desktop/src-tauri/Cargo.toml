[package]
name = "course-suite-desktop"
version = "0.0.0"
description = "Course Suite desktop app shell"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-fs = "=2.7.0"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
# Already built for Tauri itself; the media converter (src/media.rs) reads its pin and checks the
# download's SHA-256 with them.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[features]
# Serves the built frontend from inside the executable. `cargo run --no-default-features` loads the
# Vite dev server instead (README).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Small and fast over quick to compile: the installer size is a product goal (ADR-0006).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
